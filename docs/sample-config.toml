# Kosmos config, translated from Steve's four AeroSpace profiles (home, office, single,
# laptop in ~/Projects/Personal/dotfiles/aerospace/.config/aerospace/). One file replaces
# the four profile files, set-profile.sh, apply-profile.sh and migrate-to-laptop.sh.
#
# Kosmos checks the whole file before it applies any of it, and reports each problem with
# its line, column and key. Unknown keys, wrong types and invalid commands are errors.
#
# A binding's command is a string of words split at whitespace, with the command names and
# arguments of the CLI, which follow AeroSpace's.

config-version = 1
# Move the pointer into the window a hotkey, Command-Tab or a Dock click focuses or moves,
# unless it is inside the window already. Command-Tab, a launcher's app hotkey and a Dock
# click bring it along into another workspace too, while a workspace switch command moves
# it only to another display. Commands from the CLI, as the bar's workspace clicks, and
# other clicks leave the pointer where it is.
mouse-follows-focus = true
# Focus the window the pointer enters, tiled, floating or in native fullscreen, and the
# empty workspace of a display it enters, in place of AutoRaise. Holding Control stops it,
# and the pointer leaves the listed apps alone, matched by bundle identifier or name, as
# AutoRaise's ignoreApps did.
focus-follows-mouse = true
focus-follows-mouse-ignore-apps = ['Google Chrome for Testing']
# Hold Option to drag a window, as Omarchy's Super drags: the left button moves it, and a
# tiled window drops beside the window under the pointer; the right button resizes it from
# the edges nearest where it was grabbed. The app under the pointer gets none of it. Name
# the modifiers as bindings do, joined by '-', or 'off'. Alt is the default.
mouse-modifier = 'alt'
# Slide windows to the frames a relayout gives them and pop new windows in, as Omarchy
# animates Hyprland's windows. On by default; false turns both off.
animations = true

# Workspace names, in order. A profile may replace the list.
workspaces = ['1', '2', '3', '4', '5', '6', '7', '8', '9', '0']

# Normalization is always on in Kosmos: no container holds a single child, and nested
# containers alternate orientation. AeroSpace needed two keys for that.

# Names for displays. A matcher is one of: name (text the display's name contains,
# ignoring case), serial (the EDID alphanumeric serial number) or built-in = true.
[monitors]
builtin = { built-in = true }
# The twin ASUS VG279QE5A panels at home report the same name and differ only by serial.
asus-left = { serial = 'T9LMTF156643' }
asus-main = { serial = 'T9LMTF156633' }
# Either VG279QE5A, when only one is connected.
asus = { name = 'VG279QE5A' }
ultrawide = { name = 'LG ULTRAWIDE' }
office-asus = { name = 'ASUS VA24E' }

# Where each workspace goes, as one monitor or a list in order of preference. This is the
# home layout; other profiles replace it. With the lid closed at home, 8, 9 and 0 fall
# back to the main panel.
[workspace-monitor]
1 = 'asus-main'
2 = 'asus-main'
3 = 'asus-main'
4 = 'asus-main'
5 = 'asus-left'
6 = 'asus-left'
7 = 'asus-left'
8 = ['builtin', 'asus-main']
9 = ['builtin', 'asus-main']
0 = ['builtin', 'asus-main']

[gaps]
inner = 10
# External displays: 25 points of SketchyBar and a 10 point gap.
outer = { top = 35, left = 10, bottom = 10, right = 10 }
# macOS already keeps windows below the built-in display's notch band, so 5 more points
# put windows 10 points under the bar, as on the other sides.
outer-per-monitor = { builtin = { top = 5 } }

# A border around each tiled and floating window on screen, in place of JankyBorders. On by
# default, as in Omarchy: 4 points in the macOS accent color around the focused window, and
# none around the others. This table gives the focused window Tokyo Night's blue instead;
# the others' color stays transparent. The line is centered on the window's edge, as
# JankyBorders draws its width, and its corners follow the window's. Colors are '#rrggbb',
# or '#rrggbbaa' with the alpha last. `borders = false` turns borders off.
[borders]
width = 4.0
active = '#7aa2f7'
inactive = '#00000000'

# Bindings of the main mode, the mode Kosmos starts in. Kosmos pushes every change to
# SketchyBar itself, so no binding runs `sketchybar --trigger`.
[mode.main.binding]

# Focus (Caps Lock, which Karabiner turns into left Option, with arrows or vim keys).
# Floating windows count where they stand among the tiles, so one behind a tile is in
# reach. At the edge of the workspace, focus goes on to the next monitor.
alt-left = 'focus --boundaries all-monitors-outer-frame left'
alt-right = 'focus --boundaries all-monitors-outer-frame right'
alt-up = 'focus --boundaries all-monitors-outer-frame up'
alt-down = 'focus --boundaries all-monitors-outer-frame down'
alt-h = 'focus --boundaries all-monitors-outer-frame left'
alt-l = 'focus --boundaries all-monitors-outer-frame right'
alt-k = 'focus --boundaries all-monitors-outer-frame up'
alt-j = 'focus --boundaries all-monitors-outer-frame down'

# Move the window within its workspace, and at its edge onto the next monitor, where
# focus follows it. Past the last monitor it wraps to the first, as AeroSpace's
# `move || move-node-to-monitor --wrap-around` chain did.
alt-shift-left = 'move --boundaries all-monitors-outer-frame --boundaries-action wrap-around-all-monitors left'
alt-shift-right = 'move --boundaries all-monitors-outer-frame --boundaries-action wrap-around-all-monitors right'
alt-shift-up = 'move --boundaries all-monitors-outer-frame --boundaries-action wrap-around-all-monitors up'
alt-shift-down = 'move --boundaries all-monitors-outer-frame --boundaries-action wrap-around-all-monitors down'
alt-shift-h = 'move --boundaries all-monitors-outer-frame --boundaries-action wrap-around-all-monitors left'
alt-shift-l = 'move --boundaries all-monitors-outer-frame --boundaries-action wrap-around-all-monitors right'
alt-shift-k = 'move --boundaries all-monitors-outer-frame --boundaries-action wrap-around-all-monitors up'
alt-shift-j = 'move --boundaries all-monitors-outer-frame --boundaries-action wrap-around-all-monitors down'

# Switch workspace. On the laptop profile, 6 to 0 do not exist and these keys do nothing.
alt-1 = 'workspace 1'
alt-2 = 'workspace 2'
alt-3 = 'workspace 3'
alt-4 = 'workspace 4'
alt-5 = 'workspace 5'
alt-6 = 'workspace 6'
alt-7 = 'workspace 7'
alt-8 = 'workspace 8'
alt-9 = 'workspace 9'
alt-0 = 'workspace 0'

# Move the window to a workspace and follow it.
alt-shift-1 = 'move-node-to-workspace --focus-follows-window 1'
alt-shift-2 = 'move-node-to-workspace --focus-follows-window 2'
alt-shift-3 = 'move-node-to-workspace --focus-follows-window 3'
alt-shift-4 = 'move-node-to-workspace --focus-follows-window 4'
alt-shift-5 = 'move-node-to-workspace --focus-follows-window 5'
alt-shift-6 = 'move-node-to-workspace --focus-follows-window 6'
alt-shift-7 = 'move-node-to-workspace --focus-follows-window 7'
alt-shift-8 = 'move-node-to-workspace --focus-follows-window 8'
alt-shift-9 = 'move-node-to-workspace --focus-follows-window 9'
alt-shift-0 = 'move-node-to-workspace --focus-follows-window 0'

# Next and previous walk the focused monitor's workspaces and wrap around.
alt-tab = 'workspace next'
alt-shift-tab = 'workspace prev'
ctrl-alt-tab = 'workspace-back-and-forth'

alt-t = 'layout floating tiling'
# A fullscreen window covers the display without outer gaps.
alt-f = 'fullscreen'
alt-equal = 'resize smart +100'
alt-minus = 'resize smart -100'
alt-shift-equal = 'resize smart +50'
alt-shift-minus = 'resize smart -50'

ctrl-alt-left = 'join-with left'
ctrl-alt-right = 'join-with right'
ctrl-alt-up = 'join-with up'
ctrl-alt-down = 'join-with down'

ctrl-alt-j = 'layout tiles horizontal vertical'
ctrl-alt-r = 'flatten-workspace-tree'
ctrl-alt-c = 'reload-config'
# AeroSpace's ctrl-alt-a swapped its focus follows mouse and AutoRaise.
ctrl-alt-a = 'focus-follows-mouse toggle'

# Move the window to the next or previous workspace of its monitor, and follow it.
ctrl-alt-shift-left = 'move-node-to-workspace --focus-follows-window prev'
ctrl-alt-shift-right = 'move-node-to-workspace --focus-follows-window next'
# Move the window to another monitor, by direction or by number from the left, and
# follow it.
ctrl-alt-shift-up = 'move-node-to-monitor --wrap-around --focus-follows-window up'
ctrl-alt-shift-down = 'move-node-to-monitor --wrap-around --focus-follows-window down'
ctrl-alt-shift-1 = 'move-node-to-monitor --focus-follows-window 1'
ctrl-alt-shift-2 = 'move-node-to-monitor --focus-follows-window 2'
ctrl-alt-shift-3 = 'move-node-to-monitor --focus-follows-window 3'

# Apply a profile until the displays change, as set-profile.sh did.
ctrl-alt-h = 'profile home'
ctrl-alt-w = 'profile office'
ctrl-alt-l = 'profile laptop'
ctrl-alt-s = 'profile single'

# Window rules. The first rule that matches a new window applies, and Kosmos warns about a
# rule an earlier one hides. app-id matches the bundle identifier; app-name matches names
# containing the text, ignoring case.
[[rule]]
app-name = 'Finder'
float = true

[[rule]]
app-name = 'IINA'
float = true

[[rule]]
app-name = 'Pixea'
float = true

[[rule]]
app-name = 'Numi'
float = true

[[rule]]
app-name = 'TLauncher'
float = true

# Daily apps on fixed workspaces. A rule applies to new windows; a window moved by hand
# stays where it is. Launching or activating an app whose new window a rule sends to a
# hidden workspace switches to that workspace, as a Hyprland workspace rule without
# `silent` does. A window an app opens in the background leaves the workspaces alone.
[[rule]]
app-id = 'com.mitchellh.ghostty'
workspace = '1'

[[rule]]
app-id = 'com.openai.codex'
workspace = '2'

[[rule]]
app-id = 'net.imput.helium'
workspace = '3'

[[rule]]
app-id = 'com.microsoft.teams2'
workspace = '5'

[[rule]]
app-id = 'com.spotify.client'
workspace = '6'

# The YouTube Safari web app. Its bundle identifier is a different UUID on each install.
[[rule]]
app-name = 'YouTube'
workspace = '7'

# Every Chrome window, including browser test launches, floats on workspace 4, away from
# the current work.
[[rule]]
app-id = 'com.google.Chrome'
float = true
workspace = '4'

[[rule]]
app-id = 'com.google.chrome.for.testing'
float = true
workspace = '4'

[[rule]]
app-id = 'net.whatsapp.WhatsApp'
float = true

[[rule]]
app-id = 'com.apple.MobileSMS'
float = true

[[rule]]
app-id = 'com.bitwarden.desktop'
float = true

[[rule]]
app-name = 'App Store'
float = true

[[rule]]
app-name = 'FaceTime'
float = true

# Display profiles. The first profile whose `when` monitors are all connected applies. One
# without `when` applies to the built-in display alone, and at launch when no other does.
# Any other displays keep the profile that applies, as apply-profile.sh kept its profile for
# displays it did not know. A profile changes only the keys it sets, and its rules come
# before the ones above.

# Both ASUS panels, with or without the lid open. The base config above is this layout.
[[profile]]
name = 'home'
when = ['asus-left', 'asus-main']

[[profile]]
name = 'single'
when = ['asus']
workspace-monitor = { 1 = 'asus', 2 = 'asus', 3 = 'asus', 4 = 'asus', 5 = 'asus', 6 = 'asus', 7 = 'asus', 8 = ['builtin', 'asus'], 9 = ['builtin', 'asus'], 0 = ['builtin', 'asus'] }

[[profile]]
name = 'office'
when = ['ultrawide']
workspace-monitor = { 1 = 'ultrawide', 2 = 'ultrawide', 3 = 'ultrawide', 4 = 'ultrawide', 5 = 'office-asus', 6 = 'office-asus', 7 = 'office-asus', 8 = 'builtin', 9 = 'builtin', 0 = 'builtin' }

# The office's ASUS VA24E without the ultrawide gets the same layout.
[[profile]]
name = 'office-va24e'
when = ['office-asus']
workspace-monitor = { 1 = 'ultrawide', 2 = 'ultrawide', 3 = 'ultrawide', 4 = 'ultrawide', 5 = 'office-asus', 6 = 'office-asus', 7 = 'office-asus', 8 = 'builtin', 9 = 'builtin', 0 = 'builtin' }

# The laptop alone.
[[profile]]
name = 'laptop'
workspaces = ['1', '2', '3', '4', '5']
workspace-monitor = { 1 = 'builtin', 2 = 'builtin', 3 = 'builtin', 4 = 'builtin', 5 = 'builtin' }
# Windows on the workspaces this profile leaves out move here, and go back when a profile
# with their workspace applies again.
merge-workspaces = { 6 = '1', 7 = '2', 8 = '3', 9 = '4', 0 = '5' }

# Spotify and YouTube share workspace 4 with Chrome on the laptop.
[[profile.rule]]
app-id = 'com.spotify.client'
workspace = '4'

[[profile.rule]]
app-name = 'YouTube'
workspace = '4'
