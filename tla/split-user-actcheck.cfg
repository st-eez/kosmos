\* As split-user-quiet, with the activation read reporting only while its app is front. Expected to fail: a Command-Tab read after Kosmos fronted another app is dropped.
CONSTANTS
    Win <- MC_Win
    WsOf <- MC_WsOf
    AppOf <- MC_AppOf
    Workspaces = {1, 2, 3}
    MaxEvents = 3
    AllowClicks = TRUE
    AllowCmdTab = TRUE
    AllowHover = FALSE
    AllowFallback = FALSE
    RevealFirst = TRUE
    Coalesce = TRUE
    SkipOnReport = FALSE
    SplitQueue = TRUE
    BusyApp = "A"
    RaiseReports = FALSE
    RaiseKeys = TRUE
    SplitRules = "record-at-call"
    AllowBackground = FALSE
    ActFrontCheck = TRUE
    BackgroundRaise = FALSE
    LateNoteCheck = FALSE
    RaiseTimeout = FALSE
SPECIFICATION Spec
VIEW StateView
ALIAS TraceView
CHECK_DEADLOCK FALSE
INVARIANTS
    ConvergesWhenQuiet
    HonorsLastCommand
    HonorsLastActivation
    RecoveryPath
