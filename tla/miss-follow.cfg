\* As `miss`, following a hidden window's report as a Command-Tab as before. Expected to fail HonorsLastCommand: a missed focus request after a workspace command takes Kosmos to the workspace of the window the app kept key.
CONSTANTS
    Win <- MC_Win
    WsOf <- MC_WsOf
    AppOf <- MC_AppOf
    Workspaces = {1, 2, 3}
    MaxEvents = 3
    AllowClicks = TRUE
    AllowCmdTab = TRUE
    AllowLeave = FALSE
    AllowMiss = TRUE
    AllowQuiet = FALSE
    AllowReturn = FALSE
    FollowRekeys = FALSE
    FollowStale = FALSE
    Grace = TRUE
    Redirect = FALSE
    WaitBound = TRUE
    AllowFallback = FALSE
    RevealFirst = TRUE
    Coalesce = TRUE
SPECIFICATION Spec
VIEW StateView
ALIAS TraceView
CHECK_DEADLOCK FALSE
INVARIANTS
    HonorsLastCommand
