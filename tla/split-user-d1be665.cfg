\* As split-user, with the rules of robust at d1be665. Expected to fail: a late drop leaves the queue's activation unrecorded.
CONSTANTS
    Win <- MC_Win
    WsOf <- MC_WsOf
    AppOf <- MC_AppOf
    Workspaces = {1, 2, 3}
    MaxEvents = 3
    AllowClicks = TRUE
    AllowCmdTab = TRUE
    AllowHover = FALSE
    AllowFallback = FALSE
    RevealFirst = TRUE
    Coalesce = TRUE
    SkipOnReport = FALSE
    SplitQueue = TRUE
    BusyApp = "A"
    RaiseReports = TRUE
    RaiseKeys = TRUE
    SplitRules = "d1be665"
    AllowBackground = FALSE
SPECIFICATION Spec
VIEW StateView
ALIAS TraceView
CHECK_DEADLOCK FALSE
INVARIANTS
    ConvergesWhenQuiet
    HonorsLastCommand
    HonorsLastActivation
    RecoveryPath
