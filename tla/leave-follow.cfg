\* Following a re-key after the key window leaves, as before. Expected to fail KeepsWorkspaceAfterLeave: Kosmos switches away from the workspace the user was on.
CONSTANTS
    Win <- MC_Win
    WsOf <- MC_WsOf
    AppOf <- MC_AppOf
    Workspaces = {1, 2, 3}
    MaxEvents = 3
    AllowClicks = TRUE
    AllowCmdTab = TRUE
    AllowOpen = FALSE
    AllowLeave = TRUE
    AllowMiss = FALSE
    AllowQuiet = FALSE
    AllowLate = FALSE
    AllowReturn = FALSE
    FollowRekeys = TRUE
    FollowStale = FALSE
    Grace = TRUE
    MissRule = TRUE
    WaitBound = TRUE
    AllowFallback = FALSE
    RevealFirst = TRUE
    Coalesce = TRUE
SPECIFICATION Spec
VIEW StateView
ALIAS TraceView
CHECK_DEADLOCK FALSE
INVARIANTS
    KeepsWorkspaceAfterLeave
