\* All inputs with hover, with the focus queue and app workers as separate steps; app A is busy and a raise in a background app reports a focus change.
CONSTANTS
    Win <- MC_Win
    WsOf <- MC_WsOf
    AppOf <- MC_AppOf
    Workspaces = {1, 2, 3}
    MaxEvents = 3
    AllowClicks = TRUE
    AllowCmdTab = TRUE
    AllowHover = TRUE
    AllowFallback = FALSE
    RevealFirst = TRUE
    Coalesce = TRUE
    SkipOnReport = FALSE
    SplitQueue = TRUE
    BusyApp = "A"
    RaiseReports = TRUE
SPECIFICATION Spec
VIEW StateView
ALIAS TraceView
CHECK_DEADLOCK FALSE
INVARIANTS
    ConvergesWhenQuiet
    HonorsLastCommand
    HonorsLastActivation
    RecoveryPath
