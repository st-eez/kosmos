\* Commands, clicks, Command-Tab, and the key window leaving and returning: convergence, Kosmos keeps its workspace when the key window leaves, and a command wins over an earlier return.
CONSTANTS
    Win <- MC_Win
    WsOf <- MC_WsOf
    AppOf <- MC_AppOf
    Workspaces = {1, 2, 3}
    MaxEvents = 3
    AllowClicks = TRUE
    AllowCmdTab = TRUE
    AllowOpen = FALSE
    AllowLeave = TRUE
    AllowMiss = FALSE
    AllowQuiet = TRUE
    AllowReturn = TRUE
    FollowRekeys = FALSE
    FollowStale = FALSE
    Grace = TRUE
    MissRule = TRUE
    WaitBound = TRUE
    AllowFallback = FALSE
    RevealFirst = TRUE
    Coalesce = TRUE
SPECIFICATION Spec
VIEW StateView
ALIAS TraceView
CHECK_DEADLOCK FALSE
INVARIANTS
    ConvergesWhenQuiet
    HonorsLastCommand
    HonorsLastActivation
    KeepsWorkspaceAfterLeave
    RecoveryPath
