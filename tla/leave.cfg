\* Commands, clicks, Command-Tab, and the key window leaving and returning: convergence, Kosmos keeps its workspace when the key window leaves, and a command wins over an earlier return.
CONSTANTS
    Win <- MC_Win
    WsOf <- MC_WsOf
    AppOf <- MC_AppOf
    DisplayOf <- MC_DisplayOf
    Workspaces = {1, 2, 3}
    MaxEvents = 3
    AllowClicks = TRUE
    AllowCmdTab = TRUE
    AllowOpen = FALSE
    AllowLeave = TRUE
    AllowMiss = FALSE
    AllowQuiet = TRUE
    AllowLate = TRUE
    AllowReturn = TRUE
    FollowRekeys = FALSE
    FollowStale = FALSE
    Grace = TRUE
    MissRule = TRUE
    AdoptShown = TRUE
    WaitBound = TRUE
    AllowFallback = FALSE
    RevealFirst = TRUE
    Coalesce = TRUE
    AllowHover = FALSE
    AllowBackground = FALSE
    SplitQueue = FALSE
    BusyApp = "A"
    RaiseReports = TRUE
    RaiseKeys = TRUE
    SplitRules = "record-at-call"
    ActFrontCheck = FALSE
    BackgroundRaise = FALSE
    LateNoteCheck = FALSE
    RaiseTimeout = FALSE
    NoteDelay = TRUE
    NoticeDelay = FALSE
    HoldNotes = TRUE
    NoticeCheck = TRUE
    NoteFollows = FALSE
    ReassertTakes = FALSE
    PostRaise = TRUE
    PostRaiseEcho = "done"
    KeyOldFirst = FALSE
    ReadsByWindow = FALSE
    HeldDrop = FALSE
SPECIFICATION Spec
