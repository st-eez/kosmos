\* No backstop: a window taken over whose app never answers stays concealed (fails ConvergesWhenSettled, expected).
CONSTANTS
    Win <- MC_Win
    HomeOf <- MC_HomeOf
    Workspaces = {1, 2, 3}
    FirstShown = 1
    MaxEvents = 3
    Adopt = TRUE
    Grace = TRUE
    Gate = TRUE
    Expiry = TRUE
    KosmosOnly = TRUE
    ReadyGate = TRUE
    AdmitReveal = TRUE
    Backstop = FALSE
    AllowUnreadable = TRUE
    AllowHung = TRUE
    AllowLayoutLag = TRUE
    AllowGuardianFailure = TRUE
    AllowProbe = TRUE
CHECK_DEADLOCK FALSE
SPECIFICATION Spec
INVARIANTS
    ConvergesWhenSettled
