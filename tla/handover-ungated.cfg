    FirstShown = 1
    MaxEvents = 3
    Adopt = TRUE
    Grace = TRUE
    Gate = FALSE
    AdmitReveal = TRUE
    Backstop = TRUE
    AllowUnreadable = TRUE
    AllowHung = TRUE
    AllowLayoutLag = TRUE
CHECK_DEADLOCK FALSE
SPECIFICATION Spec
INVARIANTS
    RecordedBeforeHide
    NeverStranded
