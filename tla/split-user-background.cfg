\* As split-user, with background apps changing their own focused window.
CONSTANTS
    Win <- MC_Win
    WsOf <- MC_WsOf
    AppOf <- MC_AppOf
    Workspaces = {1, 2, 3}
    MaxEvents = 3
    AllowClicks = TRUE
    AllowCmdTab = TRUE
    AllowHover = FALSE
    AllowFallback = FALSE
    RevealFirst = TRUE
    Coalesce = TRUE
    SkipOnReport = FALSE
    SplitQueue = TRUE
    BusyApp = "A"
    RaiseReports = TRUE
    RaiseKeys = TRUE
    SplitRules = "record-at-call"
    AllowBackground = TRUE
    ActFrontCheck = FALSE
    BackgroundRaise = FALSE
    LateNoteCheck = FALSE
    RaiseTimeout = FALSE
SPECIFICATION Spec
VIEW StateView
ALIAS TraceView
CHECK_DEADLOCK FALSE
INVARIANTS
    ConvergesWhenQuiet
    HonorsLastCommand
    HonorsLastActivation
    RecoveryPath
