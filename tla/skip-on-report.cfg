\* Commands only, with main skipping a request for the key window macOS last reported,
\* as Kosmos did before the focus queue checked the key window. Expected to fail:
\* `workspace 2` then `workspace 1` leaves w3 key.
CONSTANTS
    Win <- MC_Win
    WsOf <- MC_WsOf
    AppOf <- MC_AppOf
    Workspaces = {1, 2, 3}
    MaxEvents = 3
    AllowClicks = FALSE
    AllowCmdTab = FALSE
    AllowHover = FALSE
    AllowFallback = FALSE
    RevealFirst = TRUE
    Coalesce = TRUE
    SkipOnReport = TRUE
    SplitQueue = FALSE
    BusyApp = "none"
    RaiseReports = FALSE
    RaiseKeys = TRUE
    SplitRules = "record-at-call"
    AllowBackground = FALSE
    ActFrontCheck = FALSE
    BackgroundRaise = FALSE
    LateNoteCheck = FALSE
    RaiseTimeout = FALSE
SPECIFICATION Spec
VIEW StateView
ALIAS TraceView
CHECK_DEADLOCK FALSE
INVARIANTS
    ConvergesWhenQuiet
    HonorsLastCommand
