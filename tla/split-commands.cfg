\* Commands, with the focus queue and app workers as separate steps; app A is busy.
CONSTANTS
    Win <- MC_Win
    WsOf <- MC_WsOf
    AppOf <- MC_AppOf
    Workspaces = {1, 2, 3}
    MaxEvents = 3
    AllowClicks = FALSE
    AllowCmdTab = FALSE
    AllowHover = FALSE
    AllowFallback = FALSE
    RevealFirst = TRUE
    Coalesce = TRUE
    SkipOnReport = FALSE
    SplitQueue = TRUE
    BusyApp = "A"
    RaiseReports = TRUE
SPECIFICATION Spec
VIEW StateView
ALIAS TraceView
CHECK_DEADLOCK FALSE
INVARIANTS
    ConvergesWhenQuiet
    HonorsLastCommand
    NoBlankFrame
    RecoveryPath
