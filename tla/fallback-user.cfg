\* If macOS re-keys after a hide, with clicks and Command-Tab. Expected to fail HonorsLastActivation: a re-key onto the followed workspace looks like a click.
CONSTANTS
    Win <- MC_Win
    WsOf <- MC_WsOf
    AppOf <- MC_AppOf
    Workspaces = {1, 2, 3}
    MaxEvents = 3
    AllowClicks = TRUE
    AllowCmdTab = TRUE
    AllowHover = FALSE
    AllowFallback = TRUE
    RevealFirst = TRUE
    Coalesce = TRUE
    SkipOnReport = FALSE
    SplitQueue = FALSE
    BusyApp = "none"
    RaiseReports = FALSE
    RaiseKeys = TRUE
    SplitRules = "record-at-call"
    AllowBackground = FALSE
    ActFrontCheck = FALSE
    BackgroundRaise = FALSE
    LateNoteCheck = FALSE
    RaiseTimeout = FALSE
    NoteDelay = FALSE
    NoticeDelay = FALSE
    HoldNotes = FALSE
    NoticeCheck = TRUE
    NoteFollows = FALSE
    ReassertTakes = FALSE
SPECIFICATION Spec
VIEW StateView
ALIAS TraceView
CHECK_DEADLOCK FALSE
INVARIANTS
    ConvergesWhenQuiet
    HonorsLastCommand
    HonorsLastActivation
PROPERTIES
    Settles
