\* Two displays, with the key window leaving and returning: convergence, and each display keeps its workspace when the key window leaves.
CONSTANTS
    Win <- MC_Win
    WsOf <- MD_WsOf
    AppOf <- MC_AppOf
    DisplayOf <- MD_DisplayOf
    Workspaces = {1, 2, 3}
    MaxEvents = 3
    AllowClicks = TRUE
    AllowCmdTab = TRUE
    AllowOpen = FALSE
    AllowLeave = TRUE
    AllowMiss = FALSE
    AllowQuiet = TRUE
    AllowLate = TRUE
    AllowReturn = TRUE
    FollowRekeys = FALSE
    FollowStale = FALSE
    Grace = TRUE
    MissRule = TRUE
    AdoptShown = TRUE
    WaitBound = TRUE
    AllowFallback = FALSE
    RevealFirst = TRUE
    Coalesce = TRUE
SPECIFICATION Spec
VIEW StateView
ALIAS TraceView
CHECK_DEADLOCK FALSE
INVARIANTS
    ConvergesWhenQuiet
    HonorsLastCommand
    HonorsLastActivation
    KeepsWorkspaceAfterLeave
    RecoveryPath
