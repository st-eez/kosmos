\* The guardian recovers at once, as before: a crash with a prompt relaunch shows the hidden windows (fails KeepsHidden, expected).
CONSTANTS
    Win <- MC_Win
    HomeOf <- MC_HomeOf
    Workspaces = {1, 2, 3}
    FirstShown = 1
    MaxEvents = 3
    Adopt = TRUE
    Grace = FALSE
    Gate = TRUE
    AdmitReveal = TRUE
    Backstop = TRUE
    AllowUnreadable = TRUE
    AllowHung = TRUE
    AllowLayoutLag = TRUE
CHECK_DEADLOCK FALSE
SPECIFICATION Spec
INVARIANTS
    NeverStranded
    KeepsHidden
