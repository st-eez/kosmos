\* Two displays, workspace commands only: convergence, last command wins, no blank frame on either display, recovery path.
CONSTANTS
    Win <- MC_Win
    WsOf <- MD_WsOf
    AppOf <- MC_AppOf
    DisplayOf <- MD_DisplayOf
    Workspaces = {1, 2, 3}
    MaxEvents = 3
    AllowClicks = FALSE
    AllowCmdTab = FALSE
    AllowOpen = FALSE
    AllowLeave = FALSE
    AllowMiss = FALSE
    AllowQuiet = FALSE
    AllowLate = FALSE
    AllowReturn = FALSE
    FollowRekeys = FALSE
    FollowStale = FALSE
    Grace = TRUE
    MissRule = TRUE
    AdoptShown = TRUE
    WaitBound = TRUE
    AllowFallback = FALSE
    RevealFirst = TRUE
    Coalesce = TRUE
SPECIFICATION Spec
VIEW StateView
ALIAS TraceView
CHECK_DEADLOCK FALSE
INVARIANTS
    ConvergesWhenQuiet
    HonorsLastCommand
    NoBlankFrame
    RecoveryPath
