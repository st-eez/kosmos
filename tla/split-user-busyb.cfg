\* As split-user, with app B busy instead of app A.
CONSTANTS
    Win <- MC_Win
    WsOf <- MC_WsOf
    AppOf <- MC_AppOf
    Workspaces = {1, 2, 3}
    MaxEvents = 3
    AllowClicks = TRUE
    AllowCmdTab = TRUE
    AllowHover = FALSE
    AllowFallback = FALSE
    RevealFirst = TRUE
    Coalesce = TRUE
    SkipOnReport = FALSE
    SplitQueue = TRUE
    BusyApp = "B"
    RaiseReports = TRUE
    RaiseKeys = TRUE
    SplitRules = "record-at-call"
    AllowBackground = FALSE
SPECIFICATION Spec
VIEW StateView
ALIAS TraceView
CHECK_DEADLOCK FALSE
INVARIANTS
    ConvergesWhenQuiet
    HonorsLastCommand
    HonorsLastActivation
    RecoveryPath
