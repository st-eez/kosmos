    Win <- MC_Win
    WsOf <- MC_WsOf
    AppOf <- MC_AppOf
    DisplayOf <- MC_DisplayOf
    Workspaces = {1, 2, 3}
    MaxEvents = 3
    AllowClicks = TRUE
    AllowCmdTab = TRUE
    AllowOpen = TRUE
    AllowLeave = FALSE
    AllowMiss = TRUE
    AllowQuiet = FALSE
    AllowLate = FALSE
    AllowReturn = FALSE
    FollowRekeys = FALSE
    FollowStale = FALSE
    Grace = TRUE
    MissRule = TRUE
    AdoptShown = TRUE
    WaitBound = TRUE
    AllowFallback = FALSE
    RevealFirst = TRUE
    Coalesce = TRUE
SPECIFICATION Spec
VIEW StateView
ALIAS TraceView
CHECK_DEADLOCK FALSE
INVARIANTS
    ConvergesWhenQuiet
    HonorsLastCommand
    HonorsLastActivation
    RecoveryPath
