\* Commands, clicks and Command-Tab, and a focus request that misses: fronting another window of the key app leaves its key window, which is reported again. The screen and key window converge, and a miss never takes Kosmos to another workspace.
CONSTANTS
    Win <- MC_Win
    WsOf <- MC_WsOf
    AppOf <- MC_AppOf
    Workspaces = {1, 2, 3}
    MaxEvents = 3
    AllowClicks = TRUE
    AllowCmdTab = TRUE
    AllowLeave = FALSE
    AllowMiss = TRUE
    AllowQuiet = FALSE
    AllowReturn = FALSE
    FollowRekeys = FALSE
    FollowStale = FALSE
    Grace = TRUE
    Redirect = TRUE
    WaitBound = TRUE
    AllowFallback = FALSE
    RevealFirst = TRUE
    Coalesce = TRUE
SPECIFICATION Spec
VIEW StateView
ALIAS TraceView
CHECK_DEADLOCK FALSE
INVARIANTS
    ConvergesWhenQuiet
    HonorsLastCommand
    HonorsLastActivation
    RecoveryPath
