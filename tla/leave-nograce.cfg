    AllowLeave = TRUE
    AllowMiss = FALSE
    AllowQuiet = FALSE
    AllowLate = FALSE
    AllowReturn = TRUE
    FollowRekeys = FALSE
    FollowStale = FALSE
    Grace = FALSE
    MissRule = TRUE
    AdoptShown = TRUE
    WaitBound = TRUE
    AllowFallback = FALSE
    RevealFirst = TRUE
    Coalesce = TRUE
    AllowHover = FALSE
    AllowBackground = FALSE
    SplitQueue = FALSE
    BusyApp = "A"
    RaiseReports = TRUE
    RaiseKeys = TRUE
    SplitRules = "record-at-call"
    ActFrontCheck = FALSE
    BackgroundRaise = FALSE
    LateNoteCheck = FALSE
    RaiseTimeout = FALSE
    NoteDelay = TRUE
    NoticeDelay = FALSE
    HoldNotes = TRUE
    NoticeCheck = TRUE
    NoteFollows = FALSE
