\* As `leave`, deciding each report at once as before, while WindowServer may still report a departed window after macOS keyed the next one. Expected to fail KeepsWorkspaceAfterLeave: Command-H on the only window of a workspace follows macOS's re-key to a concealed window.
CONSTANTS
    Win <- MC_Win
    WsOf <- MC_WsOf
    AppOf <- MC_AppOf
    Workspaces = {1, 2, 3}
    MaxEvents = 3
    AllowClicks = TRUE
    AllowCmdTab = TRUE
    AllowOpen = FALSE
    AllowLeave = TRUE
    AllowMiss = FALSE
    AllowQuiet = FALSE
    AllowLate = FALSE
    AllowReturn = TRUE
    FollowRekeys = FALSE
    FollowStale = FALSE
    Grace = FALSE
    MissRule = TRUE
    WaitBound = TRUE
    AllowFallback = FALSE
    RevealFirst = TRUE
    Coalesce = TRUE
SPECIFICATION Spec
VIEW StateView
ALIAS TraceView
CHECK_DEADLOCK FALSE
INVARIANTS
    KeepsWorkspaceAfterLeave
