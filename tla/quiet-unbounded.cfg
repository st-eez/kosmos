\* As `leave`, with a departure's wait for macOS's report of the next key window unbounded, as before. Expected to fail ConvergesWhenQuiet: an app that keeps no key window after its only window minimizes sends no report, and nothing focuses the workspace's other window.
CONSTANTS
    Win <- MC_Win
    WsOf <- MC_WsOf
    AppOf <- MC_AppOf
    Workspaces = {1, 2, 3}
    MaxEvents = 3
    AllowClicks = TRUE
    AllowCmdTab = TRUE
    AllowLeave = TRUE
    AllowMiss = FALSE
    AllowQuiet = TRUE
    AllowReturn = TRUE
    FollowRekeys = FALSE
    FollowStale = FALSE
    Grace = TRUE
    Redirect = TRUE
    WaitBound = FALSE
    AllowFallback = FALSE
    RevealFirst = TRUE
    Coalesce = TRUE
SPECIFICATION Spec
VIEW StateView
ALIAS TraceView
CHECK_DEADLOCK FALSE
INVARIANTS
    ConvergesWhenQuiet
