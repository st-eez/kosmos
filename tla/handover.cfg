\* Restarts, handovers and crashes: nothing stranded, nothing shown across a prompt restart, and each run settles right.
CONSTANTS
    Win <- MC_Win
    HomeOf <- MC_HomeOf
    Workspaces = {1, 2, 3}
    FirstShown = 1
    MaxEvents = 3
    Adopt = TRUE
    Grace = TRUE
    Gate = TRUE
    AdmitReveal = TRUE
    Backstop = TRUE
    AllowUnreadable = TRUE
    AllowHung = TRUE
    AllowLayoutLag = TRUE
CHECK_DEADLOCK FALSE
SPECIFICATION Spec
INVARIANTS
    TypeOK
    RecordedBeforeHide
    NeverStranded
    KeepsHidden
    ConvergesWhenSettled
